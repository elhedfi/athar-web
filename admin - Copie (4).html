<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Athar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 text-white flex flex-col hidden md:flex shadow-xl z-20">
            <div class="h-28 flex items-center justify-center border-b border-gray-800 p-4 bg-gray-950">
                <img src="image.jpg" alt="Logo Athar" class="h-full w-full object-contain rounded-lg bg-white p-2 shadow-inner">
            </div>
            <nav class="flex-1 p-4 space-y-2 overflow-y-auto mt-4">
                <a href="#" onclick="changerOnglet('videos')" id="btn-videos" class="flex items-center space-x-3 bg-blue-600 text-white px-4 py-3 rounded-lg shadow-md transition-colors">
                    <i class="fas fa-video w-5"></i>
                    <span class="font-medium">Gestion des Vidéos</span>
                </a>
                <a href="#" onclick="changerOnglet('categories')" id="btn-categories" class="flex items-center space-x-3 text-gray-400 hover:text-white hover:bg-gray-800 px-4 py-3 rounded-lg transition-colors">
                    <i class="fas fa-folder w-5"></i>
                    <span class="font-medium">Catégories</span>
                </a>
                <a href="#" onclick="changerOnglet('etudiants')" id="btn-etudiants" class="flex items-center space-x-3 text-gray-400 hover:text-white hover:bg-gray-800 px-4 py-3 rounded-lg transition-colors">
                    <i class="fas fa-users w-5"></i>
                    <span class="font-medium">Étudiants</span>
                </a>
            </nav>
            <div class="p-4 border-t border-gray-800">
                <a href="index.html" class="flex items-center space-x-3 text-gray-400 hover:text-white transition-colors">
                    <i class="fas fa-external-link-alt w-5"></i>
                    <span>Voir le site public</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="h-20 bg-white shadow-sm flex items-center justify-between px-8 border-b border-gray-100 z-10">
                <h1 class="text-2xl font-bold text-gray-800" id="page-title">Gestion des Vidéos</h1>
                <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold shadow-md">A</div>
            </header>

            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-8">
                <!-- SECTION 1 : VIDÉOS -->
                <div id="section-videos" class="block space-y-6">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                            <h2 class="text-lg font-bold text-gray-800">Toutes les leçons (<span id="video-count">0</span>)</h2>
                            <button onclick="openAddVideoModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg transition-colors flex items-center text-sm font-medium shadow-sm">
                                <i class="fas fa-plus mr-2"></i> Ajouter une vidéo
                            </button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-white text-gray-400 text-xs uppercase tracking-wider border-b border-gray-100">
                                        <th class="p-5 font-medium">Titre / Source (Fichier ou Lien)</th>
                                        <th class="p-5 font-medium">Spécialité</th>
                                        <th class="p-5 font-medium">Statut</th>
                                        <th class="p-5 font-medium text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="video-table-body" class="text-sm text-gray-700 divide-y divide-gray-50"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- SECTION 2 : CATÉGORIES -->
                <div id="section-categories" class="hidden space-y-6">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                            <h2 class="text-lg font-bold text-gray-800">Catégories (<span id="category-count">0</span>)</h2>
                            <button onclick="openModal('modal-category')" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium">
                                <i class="fas fa-plus mr-2"></i> Ajouter une catégorie
                            </button>
                        </div>
                        <table class="w-full text-left border-collapse">
                            <tbody id="category-table-body" class="text-sm text-gray-700 divide-y divide-gray-50"></tbody>
                        </table>
                    </div>
                </div>

                <!-- SECTION 3 : ÉTUDIANTS -->
                <div id="section-etudiants" class="hidden space-y-6">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                            <h2 class="text-lg font-bold text-gray-800">Étudiants (<span id="student-count">0</span>)</h2>
                            <button onclick="openModal('modal-student')" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium">
                                <i class="fas fa-user-plus mr-2"></i> Ajouter un étudiant
                            </button>
                        </div>
                        <table class="w-full text-left border-collapse">
                            <tbody id="student-table-body" class="text-sm text-gray-700 divide-y divide-gray-50"></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- MODAL AJOUTER / MODIFIER VIDÉO -->
    <div id="modal-video" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden">
            <div class="flex justify-between items-center p-6 border-b border-gray-100 bg-gray-50/50">
                <h3 id="modal-video-heading" class="text-lg font-bold text-gray-900">Ajouter une vidéo</h3>
                <button onclick="closeModal('modal-video')" class="text-gray-400 hover:text-gray-700"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Titre de la leçon</label>
                    <input type="text" id="video-title" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ex: Introduction à React JS">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Catégorie</label>
                    <select id="video-category" class="w-full border border-gray-300 rounded-lg px-4 py-2 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none"></select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Description / Informations du cours</label>
                    <textarea id="video-desc" rows="2" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ex: Chapitre 1 - Apprenez les bases étape par étape..."></textarea>
                </div>

                <!-- Choix 1 : Fichier local -->
                <div class="bg-blue-50/60 p-4 rounded-xl border border-blue-100">
                    <label class="block text-sm font-bold text-blue-900 mb-1">
                        <i class="fas fa-folder-open mr-1"></i> Option 1 : Parcourir une vidéo sur votre disque / serveur
                    </label>
                    <input type="file" id="video-file" accept="video/*" class="w-full bg-white border border-gray-300 rounded-lg p-2 text-sm text-gray-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
                    <p id="current-file-info" class="text-xs text-blue-700 mt-1 hidden"></p>
                </div>

                <div class="text-center text-xs font-bold text-gray-400 uppercase tracking-widest">— OU —</div>

                <!-- Choix 2 : Lien URL / YouTube -->
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <label class="block text-sm font-bold text-gray-800 mb-1">
                        <i class="fas fa-link mr-1 text-blue-600"></i> Option 2 : Ajouter un lien vidéo (YouTube ou URL directe)
                    </label>
                    <input type="text" id="video-link" class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm text-blue-600 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ex: https://www.youtube.com/watch?v=... ou https://monsite.com/video.mp4">
                </div>
            </div>
            <div class="p-5 border-t flex justify-end space-x-3 bg-gray-50">
                <button onclick="closeModal('modal-video')" class="px-5 py-2 border rounded-lg font-bold bg-white text-gray-700 hover:bg-gray-100">Annuler</button>
                <button onclick="saveVideo()" id="btn-save-video" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-md">Publier la vidéo</button>
            </div>
        </div>
    </div>

    <!-- MODAL APERÇU VIDÉO -->
    <div id="modal-preview" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl overflow-hidden">
            <div class="flex justify-between items-center p-4 border-b">
                <h3 id="preview-title" class="font-bold text-lg">Aperçu de la vidéo</h3>
                <button onclick="closePreview()" class="text-gray-500 hover:text-red-600 text-xl"><i class="fas fa-times"></i></button>
            </div>
            <div class="bg-black flex items-center justify-center w-full">
                <video id="preview-player" controls class="w-full max-h-[450px] hidden"></video>
                <iframe id="preview-iframe" class="w-full h-[450px] hidden" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- MODAL CATÉGORIE -->
    <div id="modal-category" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
            <h3 class="text-lg font-bold mb-4">Nouvelle catégorie</h3>
            <input type="text" id="category-title" class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4" placeholder="Ex: Comptabilité">
            <div class="flex justify-end space-x-2">
                <button onclick="closeModal('modal-category')" class="px-4 py-2 border rounded-lg font-bold">Annuler</button>
                <button onclick="saveCategory()" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-bold">Ajouter</button>
            </div>
        </div>
    </div>

    <!-- MODAL ÉTUDIANT -->
    <div id="modal-student" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
            <h3 class="text-lg font-bold mb-4">Nouvel étudiant</h3>
            <input type="text" id="student-name" class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-3" placeholder="Nom complet">
            <input type="email" id="student-email" class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4" placeholder="Adresse e-mail">
            <div class="flex justify-end space-x-2">
                <button onclick="closeModal('modal-student')" class="px-4 py-2 border rounded-lg font-bold">Annuler</button>
                <button onclick="saveStudent()" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-bold">Inscrire</button>
            </div>
        </div>
    </div>

    <script>
        const PROJECT_ID = "athar-edu-5832a";
        const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;

        let videos = JSON.parse(localStorage.getItem('athar_videos')) || [];
        let categories = JSON.parse(localStorage.getItem('athar_categories')) || ["Informatique & Code", "Design & UX", "Business & Marketing"];
        let students = JSON.parse(localStorage.getItem('athar_students')) || [];
        let editingVideoIndex = -1; // -1 = Mode Ajout, >= 0 = Mode Modification

        function saveLocal() {
            localStorage.setItem('athar_videos', JSON.stringify(videos));
            localStorage.setItem('athar_categories', JSON.stringify(categories));
            localStorage.setItem('athar_students', JSON.stringify(students));
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            document.getElementById(id).classList.add('flex');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        }

        function changerOnglet(onglet) {
            ['videos', 'categories', 'etudiants'].forEach(o => {
                document.getElementById('section-' + o).classList.add('hidden');
                document.getElementById('btn-' + o).className = "flex items-center space-x-3 text-gray-400 hover:text-white hover:bg-gray-800 px-4 py-3 rounded-lg transition-colors";
            });
            document.getElementById('section-' + onglet).classList.remove('hidden');
            document.getElementById('btn-' + onglet).className = "flex items-center space-x-3 bg-blue-600 text-white px-4 py-3 rounded-lg shadow-md transition-colors";
            const titres = {'videos': 'Gestion des Vidéos', 'categories': 'Gestion des Catégories', 'etudiants': 'Base de données Étudiants'};
            document.getElementById('page-title').innerText = titres[onglet];
        }

        // Ouvrir la modale en mode "Nouvelle vidéo"
        function openAddVideoModal() {
            editingVideoIndex = -1;
            document.getElementById('modal-video-heading').innerText = "Ajouter une nouvelle vidéo";
            document.getElementById('btn-save-video').innerText = "Publier la vidéo";
            document.getElementById('video-title').value = '';
            document.getElementById('video-desc').value = '';
            document.getElementById('video-file').value = '';
            document.getElementById('video-link').value = '';
            document.getElementById('current-file-info').classList.add('hidden');
            openModal('modal-video');
        }

        // Ouvrir la modale en mode "Modifier la vidéo"
        function editVideo(index) {
            editingVideoIndex = index;
            const v = videos[index];
            document.getElementById('modal-video-heading').innerText = "Modifier la vidéo";
            document.getElementById('btn-save-video').innerText = "Enregistrer les modifications";
            
            document.getElementById('video-title').value = v.titre || '';
            document.getElementById('video-category').value = v.categorie || categories[0];
            document.getElementById('video-desc').value = v.description || '';
            document.getElementById('video-file').value = '';
            document.getElementById('video-link').value = v.lien || '';

            const fileInfo = document.getElementById('current-file-info');
            if (v.fichier) {
                fileInfo.innerText = "Fichier actuel : " + v.fichier + " (laissez vide pour le conserver)";
                fileInfo.classList.remove('hidden');
            } else {
                fileInfo.classList.add('hidden');
            }

            openModal('modal-video');
        }

        function renderAll() {
            const vBody = document.getElementById('video-table-body');
            vBody.innerHTML = '';
            videos.forEach((v, index) => {
                const sourceAffichee = v.lien ? v.lien : (v.fichier || 'Aucune source');
                const iconeSource = v.lien ? 'fa-link' : 'fa-file-video';
                const safeSource = sourceAffichee.replace(/'/g, "\\'");
                const safeTitle = (v.titre || '').replace(/'/g, "\\'");

                vBody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="p-5 flex items-center">
                            <button onclick="previewVideo('${safeSource}', '${safeTitle}')" class="w-12 h-10 bg-blue-50 text-blue-600 rounded-lg mr-4 flex items-center justify-center hover:bg-blue-600 hover:text-white transition" title="Lire la vidéo">
                                <i class="fas fa-play"></i>
                            </button>
                            <div>
                                <span class="font-bold text-gray-900 block">${v.titre}</span>
                                <span class="text-xs text-blue-600"><i class="fas ${iconeSource} mr-1"></i>${sourceAffichee}</span>
                                ${v.description ? `<p class="text-xs text-gray-400 mt-0.5">${v.description}</p>` : ''}
                            </div>
                        </td>
                        <td class="p-5 text-gray-600">${v.categorie}</td>
                        <td class="p-5"><span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-semibold">Publié</span></td>
                        <td class="p-5 text-right space-x-3">
                            <button onclick="editVideo(${index})" class="text-blue-500 hover:text-blue-700 transition" title="Modifier cette vidéo">
                                <i class="fas fa-edit"></i> Modifier
                            </button>
                            <button onclick="deleteVideo(${index})" class="text-gray-400 hover:text-red-600 transition" title="Supprimer">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>`;
            });
            document.getElementById('video-count').innerText = videos.length;

            const cBody = document.getElementById('category-table-body');
            const cSelect = document.getElementById('video-category');
            cBody.innerHTML = '';
            cSelect.innerHTML = '';
            categories.forEach((c, index) => {
                cBody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-5 font-bold text-gray-900"><i class="fas fa-folder text-blue-500 mr-3"></i>${c}</td>
                        <td class="p-5 text-right"><button onclick="deleteCategory(${index})" class="text-gray-400 hover:text-red-600"><i class="fas fa-trash"></i></button></td>
                    </tr>`;
                cSelect.innerHTML += `<option value="${c}">${c}</option>`;
            });
            document.getElementById('category-count').innerText = categories.length;

            const sBody = document.getElementById('student-table-body');
            sBody.innerHTML = '';
            students.forEach((s, index) => {
                sBody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-5 font-bold text-gray-900">${s.nom} <br><span class="text-xs text-gray-500 font-normal">${s.email}</span></td>
                        <td class="p-5 text-right"><button onclick="deleteStudent(${index})" class="text-gray-400 hover:text-red-600"><i class="fas fa-trash"></i></button></td>
                    </tr>`;
            });
            document.getElementById('student-count').innerText = students.length;
        }

        function saveVideo() {
            const title = document.getElementById('video-title').value.trim();
            const category = document.getElementById('video-category').value;
            const description = document.getElementById('video-desc').value.trim();
            const fileInput = document.getElementById('video-file');
            const linkInput = document.getElementById('video-link').value.trim();

            if (!title) return alert("Veuillez entrer un titre pour la vidéo.");

            let fileName = "";
            if (fileInput.files.length > 0) {
                fileName = fileInput.files[0].name;
            } else if (editingVideoIndex >= 0) {
                fileName = videos[editingVideoIndex].fichier || "";
            }

            if (!fileName && !linkInput) {
                return alert("Veuillez soit parcourir un fichier vidéo, soit ajouter un lien vidéo.");
            }

            const videoData = {
                titre: title,
                categorie: category,
                description: description,
                fichier: fileName,
                lien: linkInput
            };

            if (editingVideoIndex >= 0) {
                // Mode Modification
                const existingDocName = videos[editingVideoIndex].docName;
                if (existingDocName) videoData.docName = existingDocName;
                videos[editingVideoIndex] = videoData;

                // Mise à jour sur Firebase si le document existe
                if (existingDocName) {
                    fetch(`https://firestore.googleapis.com/v1/${existingDocName}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            fields: {
                                titre: { stringValue: title },
                                categorie: { stringValue: category },
                                description: { stringValue: description },
                                fichier: { stringValue: fileName },
                                lien: { stringValue: linkInput }
                            }
                        })
                    }).catch(() => {});
                }
            } else {
                // Mode Ajout
                videos.unshift(videoData);
                fetch(`${FIRESTORE_URL}/videos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fields: {
                            titre: { stringValue: title },
                            categorie: { stringValue: category },
                            description: { stringValue: description },
                            fichier: { stringValue: fileName },
                            lien: { stringValue: linkInput }
                        }
                    })
                }).then(r => r.json()).then(doc => {
                    if (doc && doc.name) {
                        videoData.docName = doc.name;
                        saveLocal();
                    }
                }).catch(() => {});
            }

            saveLocal();
            closeModal('modal-video');
            renderAll();
        }

        // Convertit un lien YouTube classique en lien lecteur intégrable (embed)
        function getYouTubeEmbed(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        }

        function previewVideo(source, title) {
            const player = document.getElementById('preview-player');
            const iframe = document.getElementById('preview-iframe');
            document.getElementById('preview-title').innerText = title;

            const ytEmbed = getYouTubeEmbed(source);
            if (ytEmbed) {
                player.pause();
                player.classList.add('hidden');
                iframe.src = ytEmbed;
                iframe.classList.remove('hidden');
            } else {
                iframe.src = '';
                iframe.classList.add('hidden');
                player.classList.remove('hidden');
                player.src = source;
                player.onerror = () => {
                    player.onerror = null;
                    player.src = 'videos/' + source;
                };
                player.play().catch(() => {});
            }
            openModal('modal-preview');
        }

        function closePreview() {
            const player = document.getElementById('preview-player');
            const iframe = document.getElementById('preview-iframe');
            player.pause();
            player.src = '';
            iframe.src = '';
            closeModal('modal-preview');
        }

        function deleteVideo(index) {
            if (!confirm("Voulez-vous vraiment supprimer cette vidéo ?")) return;
            const v = videos[index];
            if (v && v.docName) {
                fetch(`https://firestore.googleapis.com/v1/${v.docName}`, { method: 'DELETE' }).catch(() => {});
            }
            videos.splice(index, 1);
            saveLocal();
            renderAll();
        }

        function saveCategory() {
            const title = document.getElementById('category-title').value.trim();
            if (!title) return alert("Veuillez entrer un nom de catégorie.");
            categories.push(title);
            saveLocal();
            document.getElementById('category-title').value = '';
            closeModal('modal-category');
            renderAll();
        }

        function deleteCategory(index) {
            categories.splice(index, 1);
            saveLocal();
            renderAll();
        }

        function saveStudent() {
            const nom = document.getElementById('student-name').value.trim();
            const email = document.getElementById('student-email').value.trim();
            if (!nom || !email) return alert("Veuillez remplir tous les champs.");
            students.unshift({ nom, email });
            saveLocal();
            document.getElementById('student-name').value = '';
            document.getElementById('student-email').value = '';
            closeModal('modal-student');
            renderAll();
        }

        function deleteStudent(index) {
            students.splice(index, 1);
            saveLocal();
            renderAll();
        }

        renderAll();
    </script>
</body>
</html>
